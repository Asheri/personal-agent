# Alembic configuration for sci-rag-kit.
#
# The database URL is NOT set here; migrations read SCI_RAG_DATABASE_URL
# (or your .env) through sci_rag.config, so there is exactly one place to
# configure the database. Run migrations with:
#
#   uv run sci-rag db upgrade
#
[alembic]
script_location = migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
