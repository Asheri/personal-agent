{% extends "main.html" %}

{% block htmltitle %}
  <title>{{ config.site_name }}</title>
{% endblock %}

{% block extrahead %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.meta.title }}">
  <meta property="og:description" content="{{ page.meta.description }}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="{{ config.site_url }}assets/diagrams/pipeline.svg">
  <meta name="twitter:card" content="summary_large_image">
{% endblock %}

{% block site_nav %}
  {% if nav %}
    <div class="md-sidebar md-sidebar--primary srag-home-nav" data-md-component="sidebar" data-md-type="navigation">
      <div class="md-sidebar__scrollwrap">
        <div class="md-sidebar__inner">
          {% include "partials/nav.html" %}
        </div>
      </div>
    </div>
  {% endif %}
{% endblock %}

{% block container %}
  <div class="srag-home-body" data-md-component="content">
    <article class="md-typeset">
      {{ page.content }}
    </article>
  </div>
{% endblock %}
