# Does a project the wizard generates actually work?
#
# The unit tests assert that no manager's commands leak into another manager's
# project. They cannot assert that the resulting project installs and runs,
# because that needs the real manager on a real runner. This workflow does.
#
# uv runs on every pull request, because it is the manager the template itself
# uses and its leg is fast. pixi and conda pull large environments over the
# network, so the full four-way matrix runs nightly and on release tags. An
# untested manager option is worse than no option, so a manager that is not
# green here should not be advertised in the documentation.
name: generated-projects

on:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: generated-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which managers this run covers. Everything except a pull request gets all
  # four. A pull request gets uv only, unless it touches the code that decides
  # what a generated project looks like, in which case it gets all four too:
  # those are exactly the changes a uv-only leg cannot catch.
  select:
    name: select-managers
    runs-on: ubuntu-latest
    outputs:
      managers: ${{ steps.pick.outputs.managers }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          ALL='["uv","pixi","conda","venv+pip"]'
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "managers=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(src/sci_rag/scaffold/|\.github/workflows/generated-projects\.yml|Dockerfile|\.devcontainer/|Makefile)'; then
            echo "the diff changes what a generated project looks like; running all four"
            echo "managers=$ALL" >> "$GITHUB_OUTPUT"
          else
            echo 'managers=["uv"]' >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        manager: ${{ fromJSON(needs.select.outputs.managers) }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sci_rag
          POSTGRES_USER: sci_rag
          POSTGRES_PASSWORD: sci_rag
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sci_rag -d sci_rag"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # The generated project runs fully offline: the deterministic local
      # embedder, no credentials, no model calls.
      SCI_RAG_EMBEDDING_PROVIDER: local-hash
      SCI_RAG_EMBEDDING_DIM: "1536"
      # pixi and conda projects run their own conda-forge database, so those
      # two legs point away from the service container above. Choosing here
      # rather than rewriting the value through GITHUB_ENV later matters: a
      # job-level env entry and a GITHUB_ENV entry of the same name have a
      # precedence a reader should not have to know, and the failure mode is
      # a green leg that quietly proved the container path twice. The port
      # differs too, so the unused service cannot answer by accident.
      SCI_RAG_LOCAL_PG_PORT: "5443"
      SCI_RAG_DATABASE_URL: >-
        ${{ (matrix.manager == 'pixi' || matrix.manager == 'conda')
        && 'postgresql+asyncpg://sci_rag:sci_rag@127.0.0.1:5443/sci_rag'
        || 'postgresql+asyncpg://sci_rag:sci_rag@localhost:5433/sci_rag' }}
    steps:
      - uses: actions/checkout@v7

      # The generator itself always runs under the template's own toolchain.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync

      - name: Generate a project for ${{ matrix.manager }}
        run: |
          mkdir -p "$RUNNER_TEMP/generated"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/generated"
          cat > "$RUNNER_TEMP/answers.yaml" <<EOF
          project_name: Generated KB
          repo_name: generated-kb
          description: A project generated by the sci-rag wizard in CI.
          author_name: sci-rag-kit CI
          contact_email: ""
          python_version: "3.12"
          environment_manager: ${{ matrix.manager }}
          credentials: offline
          ontology: keep_demo_example
          corpus_source: demo_only
          include_terraform: "No"
          include_cloud_database: "No"
          include_demo_corpus: "Yes"
          open_source_license: BSD-3-Clause
          initialize_git: "No"
          EOF
          uv run sci-rag init --answers-file "$RUNNER_TEMP/answers.yaml" \
            --target "$RUNNER_TEMP/generated"

      # The generated project must pass its own consistency check before the
      # reader touches it. A static assertion did not catch F-018; only the
      # resolver did. uv legs only: the other managers write their own lock.
      - name: The generated uv project agrees with its own lockfile
        if: matrix.manager == 'uv'
        working-directory: ${{ runner.temp }}/generated
        run: uv lock --check --offline

      # F-010: pixi tables can live in pyproject.toml or in a standalone
      # pixi.toml, and `pixi install` resolves whichever one the project has.
      # The unit tests assert the rendered Dockerfile copies it; only a real
      # build proves the copy resolves. Builder stage only, because that is
      # where the manifest matters and the runtime stage adds nothing here.
      # Both shapes. The standalone pixi.toml was absent here until #215 gave
      # it the feature tables pixi only maps for free when pyproject.toml is
      # the manifest.
      - name: Both pixi manifest shapes build their builder stage
        if: matrix.manager == 'pixi'
        run: |
          set -e
          for shape in pyproject.toml pixi.toml; do
            target="$RUNNER_TEMP/pixi-${shape%%.*}"
            mkdir -p "$target"
            git archive HEAD | tar -x -C "$target"
            cat > "$RUNNER_TEMP/pixi-answers.yaml" <<EOF
          project_name: Pixi Shape KB
          repo_name: pixi-shape-kb
          python_version: "3.12"
          environment_manager: pixi
          dependency_file: $shape
          credentials: offline
          ontology: keep_demo_example
          corpus_source: demo_only
          include_terraform: "No"
          include_cloud_database: "No"
          include_demo_corpus: "Yes"
          open_source_license: BSD-3-Clause
          initialize_git: "No"
          EOF
            uv run sci-rag init --answers-file "$RUNNER_TEMP/pixi-answers.yaml" --target "$target"
            echo "::group::$shape builder"
            grep -n '^COPY' "$target/Dockerfile" | head -3
            docker build --target builder -t "sci-rag-pixi-${shape%%.*}:ci" "$target"
            echo "::endgroup::"
          done

      - name: Cloud helper documentation matches every retained asset shape
        run: |
          # This validation reads generated files only and makes no live GCP call.
          for cloud_case in pruned kept helper-only; do
            case "$cloud_case" in
              pruned) helper="No"; terraform="No" ;;
              kept) helper="Yes"; terraform="Yes" ;;
              helper-only) helper="Yes"; terraform="No" ;;
            esac
            target="$RUNNER_TEMP/cloud-$cloud_case"
            mkdir -p "$target"
            git archive HEAD | tar -x -C "$target"
            cat > "$RUNNER_TEMP/cloud-answers.yaml" <<EOF
            project_name: Generated KB
            repo_name: generated-kb
            description: A project generated by the sci-rag wizard in CI.
            author_name: sci-rag-kit CI
            contact_email: ""
            python_version: "3.12"
            environment_manager: ${{ matrix.manager }}
            credentials: offline
            ontology: keep_demo_example
            corpus_source: demo_only
            include_terraform: $terraform
            include_cloud_database: $helper
            include_demo_corpus: "Yes"
            open_source_license: BSD-3-Clause
            initialize_git: "No"
          EOF
            uv run sci-rag init --answers-file "$RUNNER_TEMP/cloud-answers.yaml" \
              --target "$target"

            if grep -RqiE '/Users/|tylerhuntington' "$target/README.md" "$target/docs"; then
              echo "::error::$cloud_case docs contain a machine-specific path"
              exit 1
            fi

            case "$cloud_case" in
              pruned)
                test ! -e "$target/scripts/cloud_postgres.py"
                ! grep -RqsE 'scripts/cloud_postgres.py|SCI_RAG_CLOUD_PG_|infra/terraform/dev-database' \
                  "$target/README.md" "$target/docs"
                ;;
              kept)
                test -e "$target/scripts/cloud_postgres.py"
                test -d "$target/infra/terraform/dev-database"
                grep -Rqs 'scripts/cloud_postgres.py' "$target/docs"
                grep -Rqs 'infra/terraform/dev-database' "$target/docs"
                ;;
              helper-only)
                test -e "$target/scripts/cloud_postgres.py"
                test ! -e "$target/infra/terraform/dev-database"
                grep -Rqs 'scripts/cloud_postgres.py' "$target/docs"
                ! grep -Rqs 'infra/terraform/dev-database' "$target/docs"
                ;;
            esac
          done

      - name: The generated build surfaces agree with the chosen manager
        run: |
          cd "$RUNNER_TEMP/generated"
          # The install command this job runs below has to be the one the
          # generated project tells its users to run. Read it, do not assume it.
          SYNC=$(sed -n '/^setup:/,/^$/p' Makefile | sed -n '2p' | sed 's/^\t//')
          echo "generated setup command: $SYNC"
          echo "SYNC=$SYNC" >> "$GITHUB_ENV"
          for other in "uv run" "pixi run" "conda run" "astral-sh/setup-uv" \
                       "prefix-dev/setup-pixi" "conda-incubator/setup-miniconda"; do
            case "${{ matrix.manager }}:$other" in
              uv:"uv run"|uv:"astral-sh/setup-uv") continue ;;
              pixi:"pixi run"|pixi:"prefix-dev/setup-pixi") continue ;;
              conda:"conda run"|conda:"conda-incubator/setup-miniconda") continue ;;
            esac
            if grep -rqF -- "$other" Makefile Dockerfile .github/workflows README.md docs; then
              echo "::error::a ${{ matrix.manager }} project still mentions '$other'"
              grep -rnF -- "$other" Makefile Dockerfile .github/workflows README.md docs | head -20
              exit 1
            fi
          done

      - name: Install pixi
        if: matrix.manager == 'pixi'
        uses: prefix-dev/setup-pixi@v0
        with:
          manifest-path: ${{ runner.temp }}/generated/pyproject.toml
          cache: false

      - uses: conda-incubator/setup-miniconda@v4
        if: matrix.manager == 'conda'
        with:
          auto-activate: true
          activate-environment: ""

      - name: Install the generated project and run its own checks
        shell: bash -el {0}
        run: |
          cd "$RUNNER_TEMP/generated"
          case "${{ matrix.manager }}" in
            uv)       eval "$SYNC"; RUN="uv run" ;;
            pixi)     eval "$SYNC"; RUN="pixi run" ;;
            conda)    eval "$SYNC"; RUN="conda run -n generated-kb" ;;
            # An activated venv has no prefix; putting its bin directory on
            # PATH is how a user works in it, and it keeps one code path here.
            # GITHUB_PATH only applies to later steps, so export it here too.
            venv+pip) eval "$SYNC"
                      echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
                      export PATH="$PWD/.venv/bin:$PATH"
                      RUN="" ;;
          esac
          echo "RUN=$RUN" >> "$GITHUB_ENV"
          $RUN ruff check src tests examples scripts
          $RUN mypy

      # Criterion from #71: the Docker-free path is not advertised before it
      # is tested. pixi and conda projects get PostgreSQL and pgvector from
      # conda-forge in their own manifest, so those two legs ignore the
      # service container above and run the database the way their own
      # documentation tells a user to. A different port keeps the unused
      # service from colliding with it.
      - name: The generated project runs its own database, no container
        if: matrix.manager == 'pixi' || matrix.manager == 'conda'
        shell: bash -el {0}
        run: |
          cd "$RUNNER_TEMP/generated"
          $RUN python scripts/local_postgres.py start
          $RUN python scripts/local_postgres.py status

      # F-004 reached a release because this step used to run the demo's
      # first two commands and stop, with a comment explaining that the
      # blanked seed questions were "the point of the reset, not a
      # regression". They were the point for every other corpus source, and a
      # `demo_only` project was left evaluating against nothing. The target
      # decides the sequence, so the leg runs the target.
      - name: The generated project completes its own make demo
        shell: bash -el {0}
        run: |
          cd "$RUNNER_TEMP/generated"
          $RUN sci-rag db upgrade
          make demo

      # Every step above generates `corpus_source: demo_only`, which is not
      # the shape most readers get: `local_files` is the wizard default and
      # the demo corpus defaults to Yes. That project keeps the demo targets
      # while its own seed questions are correctly blank, and its `make demo`
      # was the one that could not complete (#223). uv only, because this
      # tests generation and evaluation rather than a manager.
      - name: The default corpus source keeps a demo it can still complete
        if: matrix.manager == 'uv'
        shell: bash -el {0}
        run: |
          target="$RUNNER_TEMP/default-shape"
          mkdir -p "$target"
          git archive HEAD | tar -x -C "$target"
          cat > "$RUNNER_TEMP/default-answers.yaml" <<EOF
          project_name: Default Shape KB
          repo_name: default-shape-kb
          description: The project a reader gets by pressing Enter.
          author_name: sci-rag-kit CI
          contact_email: ""
          python_version: "3.12"
          environment_manager: uv
          credentials: offline
          ontology: keep_demo_example
          corpus_source: local_files
          include_terraform: "No"
          include_cloud_database: "No"
          include_demo_corpus: "Yes"
          open_source_license: BSD-3-Clause
          initialize_git: "No"
          EOF
          uv run sci-rag init --answers-file "$RUNNER_TEMP/default-answers.yaml" --target "$target"
          cd "$target"
          # The reader's own ground truth is blank on purpose, so a bare eval
          # has to refuse. The demo target scores the demo's questions.
          uv sync
          uv run sci-rag db upgrade
          if uv run sci-rag eval retrieval; then
            echo "::error::a blank seed file scored something"
            exit 1
          fi
          make demo

      # The demo above passing does not by itself prove which database it
      # talked to, and a leg that quietly used the service container would
      # look identical. Ask the conda-forge server directly.
      - name: The corpus landed in the Docker-free database
        if: matrix.manager == 'pixi' || matrix.manager == 'conda'
        shell: bash -el {0}
        run: |
          cd "$RUNNER_TEMP/generated"
          COUNT=$($RUN psql -h 127.0.0.1 -p 5443 -U sci_rag -d sci_rag -tAc "SELECT count(*) FROM documents")
          echo "documents in the local server: $COUNT"
          [ "$(echo "$COUNT" | tr -d '[:space:]')" = "5" ] || {
            echo "::error::the demo did not ingest into the project's own database"
            exit 1
          }

      # A gate. A project generated with `credentials: offline` is a state the
      # user chose, so `doctor` warns about the unavailable generation features
      # rather than failing on them; anything it does report as FAIL here is a
      # real defect in what the wizard produced.
      - name: sci-rag doctor
        shell: bash -el {0}
        run: cd "$RUNNER_TEMP/generated" && $RUN sci-rag doctor

      - name: Stop the Docker-free database
        if: always() && (matrix.manager == 'pixi' || matrix.manager == 'conda')
        shell: bash -el {0}
        run: cd "$RUNNER_TEMP/generated" && $RUN python scripts/local_postgres.py stop

  gate:
    name: generated-projects-gate
    needs: [select, generate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every generated-project leg passed
        run: |
          echo "select=${{ needs.select.result }} generate=${{ needs.generate.result }}"
          [ "${{ needs.select.result }}" = "success" ] || exit 1
          [ "${{ needs.generate.result }}" = "success" ] || exit 1
