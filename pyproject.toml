[project]
name = "sci-rag-kit"
version = "0.5.0"
description = "Retrieval-augmented generation, built around your scientific domain."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
keywords = ["rag", "graphrag", "retrieval", "pgvector", "scientific-software", "llm", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "greenlet>=3.0",
  "alembic>=1.13",
  "pgvector>=0.3.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "questionary>=2.1",
  "structlog>=24.1",
  "httpx>=0.27",
  "google-genai>=2.0",
  "google-auth>=2.29",
  "pypdf>=4.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "mcp>=2.1",
]

[project.optional-dependencies]
# Docling gives the best PDF parsing (real table extraction), but pulls in a
# large ML stack. The kit falls back to pypdf when docling is not installed.
docling = ["docling>=2.15"]
# Exact token counting. Without it the kit uses a fast, offline approximation.
tokenizers = ["tiktoken>=0.7"]
# Local cross-encoder reranking (the LLM reranker needs no extra at all).
rerank = ["sentence-transformers>=3.0"]
# ModelScope Qwen3 本地嵌入；下载模型与加载 torch 栈均为显式可选能力。
modelscope-embedding = [
  "modelscope>=1.18",
  "sentence-transformers>=3.0",
]
# Claude for generation, on Vertex AI Model Garden or the direct API.
# 1.2 is the floor for the effort knob JSON-mode calls use.
anthropic = ["anthropic[vertex]>=1.2"]
# Any OpenAI-compatible endpoint. On Google Cloud this is the route to the
# non-Google Vertex partner models (Grok, Llama, Mistral, DeepSeek).
openai = ["openai>=1.40"]
# Parquet output for `sci-rag corpus export`. JSONL needs nothing, so this
# stays optional rather than putting Arrow in every install.
export = ["pyarrow>=17.0"]

[project.scripts]
sci-rag = "sci_rag.cli.main:app"
# The factory entry point: runs from a parent directory, with nothing cloned.
sci-rag-new = "sci_rag.cli.new:main"

[project.urls]
Homepage = "https://github.com/sustainability-software-lab/sci-rag-kit"
Documentation = "https://sustainability-software-lab.github.io/sci-rag-kit/"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.4",
  "types-pyyaml",
  # The `export` extra, pulled into dev so CI actually exercises the Parquet
  # writer rather than skipping it. A skipped test is not evidence.
  "pyarrow>=17.0",
]
docs = [
  "mkdocs==1.6.*",
  "mkdocs-material==9.7.*",
  "pymdown-extensions>=10.16,<13",
]
# Kept out of `docs` so building the site stays a light install. Only the
# rendered-geometry guard needs a browser, and it skips when this is absent.
docs-test = [
  "playwright>=1.47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sci_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint.flake8-bugbear]
# typer's Argument/Option in defaults is the canonical typer idiom.
extend-immutable-calls = [
  "typer.Argument",
  "typer.Option",
  # require_scopes returns a fastapi.Depends; calling it in a default is the point.
  "sci_rag.server.auth.require_scopes",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501", # line length is enforced by the formatter
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["sci_rag"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# asyncpg pools bind to one event loop, so all tests share a session loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "integration: needs a running Postgres (see docker-compose.yml)",
  "cloud: needs Google credentials; skipped by default in CI",
  "docs_render: needs a built site/ and a Playwright browser (see `make docs-geometry`)",
]

[tool.coverage.run]
source = ["src/sci_rag"]
